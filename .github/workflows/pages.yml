name: Pages

# Publishes the landing page (Website~/), the VPM listing (index.json) and latest.json to GitHub Pages.
# Repository setting required once: Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'Website~/**'
      - '.github/vpm/**'
      - '.github/scripts/build-listing.mjs'
      - '.github/scripts/lib.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          test -f Website~/index.html || { echo "::error::Website~/index.html is missing"; exit 1; }
          mkdir _site
          cp -r Website~/. _site/
          rm -f _site/latest.example.json
          touch _site/.nojekyll
          GITHUB_TOKEN="${GH_TOKEN}" node .github/scripts/build-listing.mjs --source .github/vpm/source.json --out _site/index.json
          gh release download --pattern latest.json --dir _site --clobber \
            || echo "::warning::No release with latest.json yet; the page uses its built-in fallback links."
          ls -la _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # A separate job, as in GitHub's template: in the same job deploy-pages can look for the artifact
  # before the artifact list shows it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
