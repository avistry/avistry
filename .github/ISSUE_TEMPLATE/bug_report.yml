name: Bug report
description: Something does not work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check that you are on the [latest release](https://github.com/avistry/avistry/releases/latest) and search the open issues first.
        **Privacy:** do not paste file paths, your user name, or avatar files you may not share.

  - type: input
    id: version
    attributes:
      label: Avistry version
      description: Open Settings in the Avistry window to see the installed version.
      placeholder: "0.3.0"
    validations:
      required: true

  - type: input
    id: unity
    attributes:
      label: Unity version
      placeholder: "2022.3.22f1"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - VRChat Creator Companion (VCC)
        - ALCOM
        - .unitypackage
        - Git URL in Package Manager
        - Other
    validations:
      required: true

  - type: dropdown
    id: shader
    attributes:
      label: Shader on the material
      multiple: true
      options:
        - Poiyomi
        - Poiyomi Pro
        - lilToon
        - Standard or another shader
        - Not related to a material

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Tools > Avistry > Textures
        2. Pick ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Support report
      description: |
        In Avistry, choose **Settings → Review support report…**. Read the preview, choose **Copy report** and paste it here. The report includes editor versions, graphics capabilities, shader family, texture sizes and the most recent recorded event.
        If your version has no report, list your operating system and graphics card.
      render: text

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Optional. If the Console contains a related error, share the relevant lines after removing file paths, asset names, account information and credentials.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Drag images or a short video here if they help.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am on the latest release.
          required: true
        - label: I removed file paths and personal information from everything above.
          required: true
